<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8fd46b">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}</style>
<title>몽글 목장 대탈출</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: full-screen 3D farm (WebGL) with a 2D effects layer on top, HUD pills along the top edge, count pill at the bottom. Single bright daytime look on purpose. */
:root{
  --grass:#8fd46b; --cream:#fff8ec; --ink:#5a3d32;
  --pink:#ff8fab; --pink-d:#e56a8c; --sun:#ffd34d; --sun-d:#f2a81d;
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--grass);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;height:100%;display:flex;flex-direction:column;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));}
#cv,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#cv{z-index:0;touch-action:none}
#fx{z-index:1;pointer-events:none}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(20,50,10,.28) 100%)}
.hud{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding-block:10px 4px;pointer-events:none}
.hud > *{pointer-events:auto}
.pill{background:var(--cream);border-radius:999px;padding:6px 14px;font-size:18px;
  box-shadow:0 3px 0 rgba(90,61,50,.22);display:flex;align-items:center;gap:6px;white-space:nowrap}
.hearts{display:flex;gap:2px}
.hearts svg{width:24px;height:24px;transition:transform .3s}
.hearts svg.lost{transform:scale(.8);opacity:.35;filter:grayscale(1)}
.sp{flex:1}
.ibtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--cream);color:var(--ink);
  box-shadow:0 3px 0 rgba(90,61,50,.22);display:grid;place-items:center;cursor:pointer;font-family:var(--font);padding:0}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(90,61,50,.22)}
.ibtn svg{width:24px;height:24px}
.ibtn:focus-visible,.btn:focus-visible{outline:3px solid var(--pink-d);outline-offset:2px}
.foot{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;justify-content:center;pointer-events:none}
.tip{position:absolute;left:16px;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:2;text-align:center;pointer-events:none}
.tip span{display:inline-block;background:rgba(255,248,236,.95);padding:8px 16px;border-radius:16px;font-size:17px;
  box-shadow:0 3px 0 rgba(90,61,50,.18);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.loading{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--grass);font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15)}

.ov{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(60,120,70,.35);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));backdrop-filter:blur(2px)}
#ovWin{align-items:end;background:linear-gradient(to bottom,rgba(0,0,0,0) 45%,rgba(50,100,60,.3));backdrop-filter:none;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#lvPill[data-tier=hard]{background:#ffe1c2;color:#b8561f}#lvPill[data-tier=super]{background:#ffd0dc;color:#c23d68}
#banner{position:fixed;left:50%;top:30%;z-index:4;pointer-events:none;display:grid;justify-items:center;gap:2px;transform:translate(-50%,-50%);animation:banIn 2.1s ease-out forwards}
#banner b{font-weight:400;font-size:44px;color:#fff;-webkit-text-stroke:7px #c23d68;paint-order:stroke fill;letter-spacing:1px;white-space:nowrap}
#banner small{font-size:18px;color:#fff;-webkit-text-stroke:5px #5a3d32;paint-order:stroke fill}
#banner.hard b{-webkit-text-stroke-color:#d06a1e}#banner.easy b{-webkit-text-stroke-color:#3f9a4c;font-size:36px}
@keyframes banIn{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1.15) rotate(2deg);opacity:1}24%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
#finger{position:fixed;left:0;top:0;z-index:4;pointer-events:none;will-change:transform}
#finger svg{display:block;transform-origin:18px 4px;filter:drop-shadow(0 3px 2px rgba(60,40,30,.3));animation:fpress 1.1s ease-in-out infinite}
#finger .rip{position:absolute;left:-16px;top:-16px;width:32px;height:32px;border-radius:50%;border:4px solid #fff;opacity:0;animation:frip 1.1s ease-out infinite}
@keyframes fpress{0%,100%{transform:translate(6px,14px) scale(1)}45%{transform:translate(0,0) scale(.92)}55%{transform:translate(0,0) scale(.92)}}
@keyframes frip{0%,40%{transform:scale(.3);opacity:0}50%{opacity:.95}100%{transform:scale(1.6);opacity:0}}
#ovTitle{align-items:end;background:linear-gradient(to bottom,rgba(0,0,0,0) 30%,rgba(50,100,60,.35));backdrop-filter:none;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.card{background:var(--cream);border-radius:28px;padding:22px 20px 20px;width:min(340px,100%);text-align:center;
  box-shadow:0 8px 0 rgba(90,61,50,.2),0 20px 40px rgba(0,0,0,.15);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:0 0 6px;font-weight:400;font-size:30px;color:var(--pink-d);text-wrap:balance}
.card p{margin:0 0 14px;font-size:17px;opacity:.85}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 14px}
.stars svg{width:54px;height:54px}
.stars svg.on{animation:starIn .5s cubic-bezier(.3,1.8,.5,1) both}
.stars svg:nth-child(2){margin-top:-12px}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.btn{display:block;width:100%;border:none;border-radius:20px;padding:14px;font-family:var(--font);font-size:22px;cursor:pointer;
  background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-d);margin-top:10px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink-d)}
.btn.y{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d);text-shadow:none}
.btn.y:active{box-shadow:0 2px 0 var(--sun-d)}
.coin{width:22px;height:22px;flex:none}
.coinGain{display:flex;align-items:center;justify-content:center;gap:6px;margin:-4px 0 12px;font-size:22px;color:#b8701a}
.coinGain .coin{width:28px;height:28px;animation:coinSpin 1.2s ease-in-out infinite}.coinGain small{font-size:14px;color:var(--ink);opacity:.7}
@keyframes coinSpin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
.coinPill{display:inline-flex;align-items:center;gap:5px;background:#fff6d6;border-radius:999px;padding:4px 12px 4px 6px;font-size:18px;color:#b8701a;margin-bottom:6px;box-shadow:inset 0 0 0 2px #ffe08a}
.btn.c{display:flex;align-items:center;justify-content:center;gap:8px;background:#ffb84d;box-shadow:0 5px 0 #d98a1e;font-size:18px;margin-bottom:10px}
.btn.c .coin{width:26px;height:26px}.btn.c:disabled{filter:grayscale(.8);opacity:.6}
.row{display:flex;gap:8px}.row .btn{font-size:16px;padding:11px 4px}
.title{word-break:keep-all;font-weight:400;font-size:42px;line-height:1.02;color:#fff;text-shadow:0 4px 0 var(--pink-d),0 8px 0 rgba(90,61,50,.25);margin:0 0 4px}
.title small{display:block;font-size:19px;color:var(--ink);text-shadow:none;margin-top:8px}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:46vh;overflow:auto;padding:4px}
.lv{border:none;border-radius:14px;background:#fff;font-family:var(--font);font-size:18px;color:var(--ink);padding:8px 0 4px;
  box-shadow:0 3px 0 rgba(90,61,50,.18);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.lv small{font-size:10px;color:var(--sun-d);letter-spacing:1px;min-height:12px}
.lv.cur{background:var(--sun)}
.lv.t-hard{box-shadow:inset 0 0 0 3px #ffb37a}.lv.t-super{box-shadow:inset 0 0 0 3px #ff8fab;background:#fff2f6}
.lv:disabled{opacity:.4;cursor:default}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>

<div id="app">
  <canvas id="cv" aria-label="게임 보드"></canvas>
  <canvas id="fx"></canvas>
  <div class="vig"></div>
  <div class="hud">
    <div class="pill" id="lvPill">레벨 1</div>
    <div class="pill hearts" id="hearts" aria-label="남은 하트"></div>
    <div class="sp"></div>
    <button class="ibtn" id="bHint" aria-label="힌트"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z" fill="#ffd34d" stroke="#5a3d32" stroke-width="1.6"/><path d="M9.5 20.5h5" stroke="#5a3d32" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="ibtn" id="bRe" aria-label="다시 하기"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3d32" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
    <button class="ibtn" id="bMenu" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3d32" stroke-width="2.4" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  </div>
  <div id="banner" hidden><b id="banT"></b><small id="banS"></small></div>
  <div id="finger" hidden><div class="rip"></div><svg viewBox="0 0 64 80" width="58" height="72"><path d="M22 6c-4 0-7 3-7 7v34l-5-6c-3-3-8-3-10 0-2 2-2 6 0 8l15 19c3 4 8 7 14 7h11c9 0 15-7 15-16V35c0-4-3-6-6-6s-5 2-5 5v-3c0-4-3-6-6-6s-5 2-5 5v-2c0-4-3-6-6-6-2 0-4 1-5 3V13c0-4-3-7-7-7z" fill="#fff" stroke="#5a3d32" stroke-width="3.5" stroke-linejoin="round"/><path d="M17 15c0-3 2-5 4-5" stroke="#ffd0dc" stroke-width="3" stroke-linecap="round" fill="none"/></svg></div>
  <div class="tip" id="tip" hidden><span id="tipTx"></span></div>
  <div class="foot"><div class="pill" id="left">남은 친구 0</div></div>
</div>
<div class="loading" id="loading">목장 준비 중…</div>

<div class="ov" id="ovTitle">
  <div class="card">
    <div class="coinPill" id="titleCoin"><svg class="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd34d" stroke="#e0951a" stroke-width="2"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#f3b53a" stroke-width="1.4"/><path d="M12 7.6l1.3 2.7 3 .4-2.2 2 .6 2.9-2.7-1.5-2.7 1.5.6-2.9-2.2-2 3-.4z" fill="#fff6c8"/></svg><b id="titleCoinN">0</b></div>
    <h1 class="title">몽글 목장 대탈출<small>얼굴이 향한 쪽이 뚫린 친구를 톡!</small></h1>
    <button class="btn" id="bPlay">시작하기</button>
    <div class="row">
      <button class="btn y" id="bLevels">레벨 고르기</button>
      <button class="btn y" id="bSound">소리 켜짐</button>
      <button class="btn y" id="bMusic">음악 켜짐</button>
    </div>
  </div>
</div>
<div class="ov" id="ovLevels" hidden>
  <div class="card">
    <h2>레벨 고르기</h2>
    <div class="lvgrid" id="lvgrid"></div>
    <button class="btn y" id="bLvBack">돌아가기</button>
  </div>
</div>
<div class="ov" id="ovWin" hidden>
  <div class="card">
    <h2 id="winT">목장 탈출 성공!</h2>
    <div class="stars" id="winStars"></div>
    <p id="winP">친구들이 모두 풀밭으로 나갔어요</p>
    <div class="coinGain" id="winCoin"><svg class="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd34d" stroke="#e0951a" stroke-width="2"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#f3b53a" stroke-width="1.4"/><path d="M12 7.6l1.3 2.7 3 .4-2.2 2 .6 2.9-2.7-1.5-2.7 1.5.6-2.9-2.2-2 3-.4z" fill="#fff6c8"/></svg><b id="winCoinN">+0</b><small id="winCoinT"></small></div>
    <button class="btn" id="bNext">다음 레벨</button>
    <button class="btn y" id="bAgain">다시 하기</button>
  </div>
</div>
<div class="ov" id="ovFail" hidden>
  <div class="card">
    <h2>앗, 하트가 없어요</h2>
    <p>친구들이 너무 많이 부딪혔어요.<br>순서를 잘 보고 다시 해 볼까요?</p>
    <button class="btn c" id="bCont"><svg class="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd34d" stroke="#e0951a" stroke-width="2"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#f3b53a" stroke-width="1.4"/><path d="M12 7.6l1.3 2.7 3 .4-2.2 2 .6 2.9-2.7-1.5-2.7 1.5.6-2.9-2.2-2 3-.4z" fill="#fff6c8"/></svg><span>30개로 하트 받고 이어하기</span></button>
    <button class="btn" id="bRetry">다시 도전</button>
    <button class="btn y" id="bFailMenu">메뉴로</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('loading').textContent='3D 엔진을 불러오지 못했어요. 새로고침해 주세요';return}
const DX=[0,1,0,-1], DZ=[-1,0,1,0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutBack=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const easeIn=t=>t*t;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- save ----------
const KEY='mongle-farm-v1';
let save={max:1,stars:{},sound:true,music:true,coins:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save=Object.assign(save,s)}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};

// ---------- audio ----------
let AC=null,master=null;
function audio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    // master chain: gentle glue compressor + a soft room reverb send shared by music and effects
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.attack.value=.004;comp.release.value=.2;comp.connect(AC.destination);
    master=AC.createGain();master.gain.value=.8;master.connect(comp);
    const len=AC.sampleRate*1.8|0,ir=AC.createBuffer(2,len,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++){const k=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-k,3.2)*(i<200?i/200:1)}}
    const conv=AC.createConvolver();conv.buffer=ir;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;REV=AC.createGain();REV.gain.value=.9;REV.connect(lp);lp.connect(conv);const wet=AC.createGain();wet.gain.value=.22;conv.connect(wet);wet.connect(comp);
  }catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume(); setTimeout(()=>bgmStart(),0); }
let REV=null;
// one synth voice: osc -> (filter) -> amp envelope -> dry + reverb send
function vox(f0,f1,dur,{type='sine',vol=.2,delay=0,att=.008,vib=0,vibF=6,lp=0,q=1,wet=.25,dest=null,mid=0,t0=null}={}){
  if(!AC)return;const t=t0??(AC.currentTime+delay);const o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);if(mid){o.frequency.exponentialRampToValueAtTime(mid,t+dur*.4);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur)}else if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=vibF;lg.gain.value=f0*vib;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+.05)}
  let node=o;if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;fl.Q.value=q;o.connect(fl);node=fl}
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0006,t+dur);node.connect(g);
  const out=dest||master;g.connect(out);if(REV&&wet&&!dest){const s=AC.createGain();s.gain.value=wet;g.connect(s);s.connect(REV)}
  o.start(t);o.stop(t+dur+.05)}
function tone(f0,f1,dur,type='sine',vol=.3,delay=0){if(!AC||!save.sound)return;vox(f0,f1,dur,{type,vol,delay})}
let _nb=null;function nbuf(){if(!_nb){const n=AC.sampleRate;_nb=AC.createBuffer(1,n,AC.sampleRate);const d=_nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}return _nb}
function noise(dur,freq,vol=.15,delay=0,{type='bandpass',q=1.2,sweep=2.5,wet=.15,dest=null,t0=null,att=.004}={}){if(!AC||(!dest&&!save.sound))return;const t=t0??(AC.currentTime+delay);
  const s=AC.createBufferSource();s.buffer=nbuf();const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(freq*sweep,t+dur);f.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0006,t+dur);s.connect(f);f.connect(g);g.connect(dest||master);
  if(REV&&wet){const w=AC.createGain();w.gain.value=wet;g.connect(w);w.connect(REV)}s.start(t,Math.random()*.5);s.stop(t+dur+.05)}
const bell=(f,vol=.12,delay=0,dur=.6)=>{vox(f,f,dur,{vol,delay,wet:.4});vox(f*2.76,f*2.76,dur*.35,{vol:vol*.35,delay,wet:.4});vox(f*5.4,f*5.4,dur*.15,{vol:vol*.15,delay,wet:.3})};
const PENTA=[0,2,4,7,9];const pn=i=>523.25*Math.pow(2,(PENTA[i%5]+12*Math.floor(i/5))/12);
const SND=fn=>(...a)=>{if(AC&&save.sound)fn(...a)};
const SFX={
  tap:SND(()=>{vox(1300,700,.07,{type:'triangle',vol:.22,wet:.08});noise(.03,3000,.08,0,{q:3,wet:0})}),
  ui:SND(()=>{vox(880,1320,.07,{type:'triangle',vol:.1,wet:.1});vox(1760,1760,.05,{vol:.04,delay:.03,wet:.1})}),
  // escape: bright rising pentatonic pluck that climbs with the combo, plus a little whoosh
  go:SND((p=0)=>{const f=pn(Math.min(p,14));vox(f,f,.35,{type:'triangle',vol:.2,wet:.3});bell(f*2,.06,.02,.4);noise(.28,700,.07,.03,{sweep:3.5,wet:.05})}),
  voice:SND(sp=>{const V={
    chick:()=>{for(let i=0;i<3;i++)vox(2300,2900,.06,{vol:.11,delay:i*.07,wet:.15})},
    cow:()=>{vox(190,150,.5,{type:'sawtooth',vol:.12,lp:700,q:2,vib:.03,vibF:5,att:.05,wet:.2,mid:210})},
    bunny:()=>{vox(1500,2000,.07,{vol:.1});vox(1700,2200,.07,{vol:.09,delay:.09})},
    cat:()=>{vox(620,520,.38,{type:'triangle',vol:.12,lp:2400,mid:900,att:.04,wet:.2})},

function params(L){

  const dens=clamp(.72+L*.009+T.dens,.6,.96);

    for(let i=0;i<p.rocks;i++){const c=r()*p.cols|0,rr=r()*p.rows|0;if(!grid[rr][c]&&!p.mask[rr][c]){const o={kind:'obs',r:rr,c,v:r()<.55?'rock':'hay',wig:0};grid[rr][c]=o;obs.push(o)}}
    const animals=[];let tries=0;
    const spPool=SP_KEYS.slice(0,clamp(2+Math.floor(L/2),2,6));
    while(animals.length<p.count&&tries<p.cols*p.rows*40){tries++;
      const c=r()*p.cols|0,rr=r()*p.rows|0;if(grid[rr][c]||p.mask[rr][c])continue;
      const dirs=[0,1,2,3].filter(d=>clearPath(grid,p,rr,c,d));if(!dirs.length)continue;
      const a={kind:'animal',r:rr,c,dir:dirs[r()*dirs.length|0],sp:spPool[r()*spPool.length|0],seed:r()};grid[rr][c]=a;animals.push(a)}

    if(p.sleep){const cand=animals.filter(a=>animals.some(b=>Math.abs(b.r-a.r)+Math.abs(b.c-a.c)===1));
      for(let i=cand.length-1;i>0;i--){const j=r()*(i+1)|0;[cand[i],cand[j]]=[cand[j],cand[i]]}
      let n=0;for(const a of cand){if(n>=p.sleep)break;a.sleep=true;if(solvable(grid,p,animals))n++;else a.sleep=false}}
    const free=animals.filter(a=>!a.sleep&&clearPath(grid,p,a.r,a.c,a.dir,a)).length;
    const score=animals.length*3-free*2;
    cands.push({score,grid,animals,obs,p});
  }
  cands.sort((a,b)=>a.score-b.score);best=cands[Math.round(T.pick*(cands.length-1))];
  return best;
}

  if(!G)return;
  const W=innerWidth,H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();
  const pitch=58*Math.PI/180;const dir=new THREE.Vector3(0,Math.sin(pitch),Math.cos(pitch));
  const hx=G.cols/2+.55,hz=G.rows/2+.55;
  const pts=[];for(const sx of[-1,1])for(const sz of[-1,1])for(const y of[0,.9])pts.push(new THREE.Vector3(sx*hx,y,sz*hz));pts.push(new THREE.Vector3(0,1.2,-(G.rows/2+1.3+2.3)+1.3));
  const topLim=1-2*(Math.min(150,H*.16)/H), botLim=-1+2*(Math.min(120,H*.12)/H);
  let tz=0,D=4;
  const proj=()=>{let ok=true,ymin=9,ymax=-9;for(const p of pts){const v=p.clone().project(camera);if(Math.abs(v.x)>.95)ok=false;ymin=Math.min(ymin,v.y);ymax=Math.max(ymax,v.y)}return{ok,ymin,ymax}};
  const place=()=>{camera.position.copy(dir).multiplyScalar(D).add(new THREE.Vector3(0,0,tz));camera.lookAt(0,0,tz);camera.updateMatrixWorld()};
  for(let iter=0;iter<4;iter++){
    for(D=4;D<80;D+=.2){place();const q=proj();if(q.ok&&q.ymax-q.ymin<=topLim-botLim)break}
    const q=proj();const want=(topLim+botLim)/2,have=(q.ymin+q.ymax)/2;tz-=(have-want)*D*.3;
  }

function update(dt){
  time+=dt;shake=Math.max(0,shake-dt*.6);
  if(tipTimer>0&&tipTimer<50){tipTimer-=dt;if(tipTimer<=0)$('tip').hidden=true}
  if(!G)return;
  let alive=0;
  for(const a of G.animals){
    if(a.state==='gone')continue;
    const m=a.m;a.appear=Math.min(1,a.appear+dt*2.6);
    a.wig=Math.max(0,a.wig-dt*2.2);a.sq=Math.max(0,a.sq-dt*3.5);

    m.eyes.forEach((e,i)=>{const k=i?1:-1;if(a.sleep){e.scale.set(1.1,.12,1);e.rotation.z=-k*.12}else if(f==='ouch'){e.scale.set(1.15,.22,1);e.rotation.z=k*.45}else if(f==='joy'){e.scale.set(1.1,.3,1);e.rotation.z=-k*.25}else{e.scale.set(1,blink,1);e.rotation.z=0}});
    const br=Math.sin(time*3.2+a.seed*9);
    let hop=0,sx=1,sy=1+br*(a.sleep?.05:.025),sz=1;
    if(a.hopT>0){a.hopT-=dt;hop=Math.abs(Math.sin(a.hopT*Math.PI*4))*.12}
    let yaw=a.state==='idle'&&!a.sleep?Math.sin(time*.9+a.seed*20)*.18:0;
    if(a.look&&a.state==='idle'){a.look.t-=dt;const tp=cellPos(a.look.c,a.look.r),me=cellPos(a.c,a.r);let d=Math.atan2(tp.x-me.x,tp.z-me.z)-m.root.rotation.y;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;yaw=clamp(d,-1,1);if(a.look.t<=0)a.look=null}
    m.head.rotation.y+=(yaw-m.head.rotation.y)*Math.min(1,dt*10);
    m.head.rotation.z=Math.sin(time*1.3+a.seed*7)*.06;
    if(a.state==='exit'){
      if(a.delay>0){a.delay-=dt;hop=Math.abs(Math.sin(time*18))*.06}
      else{a.v=Math.min(a.v+dt*16,7);a.pd+=a.v*dt;hop=Math.abs(Math.sin(a.pd*Math.PI*1.25))*.2;sy=1+Math.sin(a.pd*Math.PI*2.5)*.08;sx=sz=1/Math.sqrt(sy)}
      const P=a.path,q=pathAt(P,a.pd);
      let da=q.ang-a.ang;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;a.ang+=da*(1-Math.exp(-dt*12));

      a.wpos=q.p;
      if(a.delay<=0&&Math.random()<dt*20){const[px,py]=toScreen(q.p.clone().add(new THREE.Vector3(-Math.sin(a.ang)*.35,.05,-Math.cos(a.ang)*.35)));parts.push({x:px+(Math.random()-.5)*10,y:py,vx:(Math.random()-.5)*30,vy:-15-Math.random()*15,life:.4,max:.4,s:3+Math.random()*3,c:'rgba(255,250,240,.85)',t:'puff'})}

        const[ex,ey]=toScreen(new THREE.Vector3(0,1.3,G.track.door));SFX.poof();for(let i=0;i<4;i++)parts.push({x:ex+(Math.random()-.5)*30,y:ey,vx:(Math.random()-.5)*80,vy:-60-Math.random()*90,life:.8,max:.8,s:6,c:'#ff8fab',t:'heart'});continue}

    if(a.state==='exit'){const onB=Math.abs(a.wpos.x)<G.cols/2+.1&&Math.abs(a.wpos.z)<G.rows/2+.1;a.gy=(a.gy??BH)+((onB?BH:.02)-(a.gy??BH))*Math.min(1,dt*14);m.root.position.set(a.wpos.x,a.gy+hop,a.wpos.z)}

// ---------- 2D fx layer ----------
function star2(c,x,y,s){c.beginPath();for(let i=0;i<10;i++){const r=i%2?s*.45:s,a=i/10*Math.PI*2-Math.PI/2;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.closePath();c.fill()}
function heart2(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.9);c.bezierCurveTo(x-s*1.4,y,x-s*.7,y-s,x,y-s*.3);c.bezierCurveTo(x+s*.7,y-s,x+s*1.4,y,x,y+s*.9);c.fill()}
function drawFx(){
  const c=fctx;c.clearRect(0,0,innerWidth,innerHeight);
  for(const p of parts){const k=p.life/p.max;c.globalAlpha=Math.min(1,k*1.6);c.fillStyle=p.c;
    if(p.t==='puff'){c.beginPath();c.arc(p.x,p.y,p.s*(1.5-k*.6),0,7);c.fill()}
    else if(p.t==='heart')heart2(c,p.x,p.y,p.s);
    else if(p.t==='star')star2(c,p.x,p.y,p.s*1.6*k+1);
    else if(p.t==='conf'){c.save();c.translate(p.x,p.y);c.rotate(p.life*8+p.s);c.fillRect(-5,-3,10,6);c.restore()}
    else{c.beginPath();c.arc(p.x,p.y,p.s*k,0,7);c.fill()}}
  c.globalAlpha=1;c.textAlign='center';c.lineJoin='round';
  for(const f of floats){const k=f.life/f.max;c.globalAlpha=Math.min(1,k*2);c.font='28px Jua, system-ui';c.lineWidth=6;c.strokeStyle=f.red?'#c94a6c':'#5a3d32';c.strokeText(f.txt,f.x,f.y);c.fillStyle='#fff';c.fillText(f.txt,f.x,f.y)}
  c.globalAlpha=1;
}

// adaptive quality: if the phone struggles, lower resolution, then shadows
const Q={dpr:Math.min(window.devicePixelRatio||1,2),acc:0,n:0,step:0,wait:1.5};
function tuneQuality(dt){if(Q.step>=3||state!=='play')return;if(Q.wait>0){Q.wait-=dt;return}Q.acc+=dt;Q.n++;
  if(Q.n<90)return;const avg=Q.acc/Q.n;Q.acc=0;Q.n=0;Q.wait=1;
  if(avg>1/42){Q.step++;if(Q.step===1){Q.dpr=Math.min(Q.dpr,1.5)}else if(Q.step===2){Q.dpr=Math.min(Q.dpr,1.15);sun.shadow.mapSize.set(1024,1024);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}else{sun.castShadow=false}
    renderer.setPixelRatio(Q.dpr);renderer.setSize(innerWidth,innerHeight,false)}else Q.step=3}
let last=performance.now();
function loop(now){const rdt=(now-last)/1000,dt=Math.min(.05,rdt);last=now;tuneQuality(Math.min(rdt,.2));update(dt);renderer.render(scene,camera);drawFx();requestAnimationFrame(loop)}

// ---------- flow ----------
function show(id){if(id==='ovTitle'){bgmSong('nap');$('titleCoinN').textContent=save.coins||0}['ovTitle','ovLevels','ovWin','ovFail'].forEach(k=>$(k).hidden=k!==id);state=id?'menu':'play'}
function countUp(el,n){const t0=performance.now();const f=()=>{const k=Math.min(1,(performance.now()-t0)/700);el.textContent='+'+Math.round(n*k);if(k<1)requestAnimationFrame(f);else{SFX.coin&&SFX.coin()}};f();let i=0;const iv=setInterval(()=>{if(++i>6)clearInterval(iv);else SFX.tick&&SFX.tick(i)},100)}
function win(){

  save.stars[L]=Math.max(save.stars[L]||0,st);save.max=Math.max(save.max,L+1);persist();
  startParty();bgmDuck(.12,4.5);setTimeout(()=>SFX.stars(st),2000);
  // coins: base + stars + tier bonus, first clear pays double
  const first=!G.cleared0,gain=(5+st*5+({hard:10,super:20}[G.tier]||0))*(first?2:1);save.coins=(save.coins||0)+gain;persist();
  $('winCoinN').textContent='+0';$('winCoinT').textContent=first?'첫 클리어 2배!':'';setTimeout(()=>countUp($('winCoinN'),gain),2300);
  setTimeout(()=>{SFX.win();buzz([30,40,60]);for(let i=0;i<100;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.3,y:innerHeight*.35,vx:(Math.random()-.5)*750,vy:-Math.random()*650-100,life:1.8+Math.random(),max:2.8,s:Math.random()*6,c:['#ff8fab','#ffd34d','#7fdcc0','#9ac8ff','#fff'][i%5],t:'conf'})},1100);

  $('winT').textContent=`레벨 ${L} 탈출 성공!`;$('winP').textContent=msgs[3-st];
  const starSvg=on=>`<svg viewBox="0 0 24 24" class="${on?'on':''}"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.6 6.6-.8z" fill="${on?'#ffd34d':'#e9dcc6'}" stroke="${on?'#e0951a':'#cbb99c'}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
  $('winStars').innerHTML=[0,1,2].map(i=>starSvg(i<st)).join('');
  [...$('winStars').children].forEach((s,i)=>s.style.animationDelay=(.25+i*.18)+'s');
  setTimeout(()=>{if(G&&G.L===L&&party.on)show('ovWin')},2000);

// ---------- win party: everyone pops back out of the mushroom house and dances ----------
const party={on:false,k:0,list:[],home:null};
function startParty(){
  const door=G.track.door,seen=[...new Set(G.animals.map(a=>a.sp))];const n=7,list=[];
  const order=[3,2,4,1,5,0,6];
  for(let i=0;i<n;i++){const sp=seen[i%seen.length];const m=buildCritter(sp);const t=i-(n-1)/2;
    m.root.position.set(0,0,door);m.bob.scale.setScalar(.001);levelGroup.add(m.root);
    list.push({m,sp,x:t*.86,z:door+2.05-t*t*.06,delay:order.indexOf(i)*.16+.15,t:0,ph:i*.9,landed:false})}
  $('left').style.opacity=0;party.on=true;party.k=0;party.list=list;party.home={b:camBase.clone(),t:camTarget.clone()};
}
function updateParty(dt){if(!party.on)return;
  party.k=Math.min(1,party.k+dt/1.6);const k=easeInOut(party.k),H=party.home,door=G.track.door;
  const tgt=new THREE.Vector3(0,.3,door+3.1);const dir=H.b.clone().sub(H.t);const d0=dir.length();dir.normalize();
  camTarget.lerpVectors(H.t,tgt,k);camBase.copy(camTarget).addScaledVector(dir,d0+(15-d0)*k);
  for(const p of party.list){p.t+=dt;const m=p.m;const u=clamp((p.t-p.delay)/.55,0,1);
    if(p.t<p.delay)continue;
    if(!p.out){p.out=true;envRef.bounce=1;SFX.poof()}
    if(u<1){const e=easeOut(u);m.root.position.set(p.x*e,Math.sin(u*Math.PI)*1.1,door+(p.z-door)*e);m.bob.scale.setScalar(.3+.7*Math.min(1,u*2.5));m.root.rotation.y=Math.atan2(p.x,p.z-door)*(1-u)}
    else{if(!p.landed){p.landed=true;SFX.go(order7(p));SFX.voice(p.sp);emote(Math.random()<.6?'heart':'note',m.root,1.25,1.1,.7)}
      const b=time*Math.PI*2*1.8+p.ph;const hop=Math.abs(Math.sin(b/2))*.28;const sq=1+Math.cos(b)*.06;
      m.root.position.set(p.x,hop,p.z);m.root.rotation.y=Math.sin(time*2.4+p.ph)*.35;m.bob.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));m.bob.rotation.z=Math.sin(b/2)*.12;
      m.head.rotation.z=Math.sin(b/2+1)*.15;m.head.rotation.x=-.32;m.blob.position.y=.02-hop;
      if(Math.random()<dt*.3)emote(['heart','note','heart'][Math.random()*3|0],m.root,1.3,1,.6)}
    m.eyes.forEach((e,i)=>{e.scale.set(1.1,.3,1);e.rotation.z=(i?-1:1)*.25})}
}
const order7=p=>party.list.indexOf(p)+2;
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,easeOut=t=>1-Math.pow(1-t,3);
function buildLevels(){
  const n=Math.max(30,Math.ceil((save.max+5)/5)*5);let h='';
  for(let i=1;i<=n;i++){const s=save.stars[i]||0;const tr=tierOf(i);h+=`<button class="lv${i===save.max?' cur':''} t-${tr}" data-l="${i}" ${i>save.max?'disabled':''}>${i}<small>${'★'.repeat(s)}</small></button>`}
  $('lvgrid').innerHTML=h;
}
$('lvgrid').addEventListener('click',e=>{const b=e.target.closest('.lv');if(!b||b.disabled)return;audio();SFX.ui();show(null);startLevel(+b.dataset.l)});
$('bPlay').onclick=()=>{audio();SFX.ui();show(null);startLevel(save.max)};
$('bLevels').onclick=()=>{audio();SFX.ui();buildLevels();show('ovLevels')};
$('bLvBack').onclick=()=>{SFX.ui();show('ovTitle')};
$('titleCoinN').textContent=save.coins||0;
const sndLabel=()=>$('bSound').textContent=save.sound?'소리 켜짐':'소리 꺼짐';sndLabel();
$('bSound').onclick=()=>{save.sound=!save.sound;persist();sndLabel();if(!save.sound)bgmStop();audio();SFX.ui()};
const musLabel=()=>$('bMusic').textContent=save.music?'음악 켜짐':'음악 꺼짐';musLabel();

  const hs=$('hearts').children[0];if(hs)hs.animate([{transform:'scale(.2)'},{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:500,easing:'ease-out'});bgmDuck(.5,.1)};

  const free=G.animals.filter(a=>a.state==='idle'&&!a.sleep&&checkFree(a).free);if(free.length){hintA=free[Math.random()*free.length|0];hintT=2.4;hintA.wig=.5}};

startLevel(Math.max(4,Math.min(save.max,8)));state='menu';$('tip').hidden=true;
$('loading').hidden=true;
requestAnimationFrame(loop);
window.__render=async(kind,sec=8)=>{const keep={AC,master,REV,g:BGM.gain,song:BGM.song,snd:save.sound,mus:save.music};
  const off=new OfflineAudioContext(2,44100*sec,44100);AC=off;REV=null;_nb=null;
  const comp=off.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.connect(off.destination);master=off.createGain();master.gain.value=.6;master.connect(comp);
  const len=off.sampleRate*1.8|0,ir=off.createBuffer(2,len,off.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++){const k=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-k,3.2)}}
  const conv=off.createConvolver();conv.buffer=ir;REV=off.createGain();REV.connect(conv);const wet=off.createGain();wet.gain.value=.22;conv.connect(wet);wet.connect(comp);
  save.sound=true;BGM.gain=off.createGain();BGM.gain.gain.value=.5;BGM.gain.connect(master);const sg=off.createGain();sg.gain.value=.35;BGM.gain.connect(sg);sg.connect(REV);
  if(SONGS[kind]){BGM.song=kind;const spb=60/SONGS[kind].bpm/2;let t=.05;for(let i=0;t<sec-1;i++,t+=spb)bgmStep(i,t)}
  else{const list=kind.split(',');list.forEach((k,i)=>{const [n,arg]=k.split(':');const fn=SFX[n];const orig=off.currentTime;/* schedule via delay */ setTimeout(()=>{},0);
      const saveCT=Object.getOwnPropertyDescriptor(BaseAudioContext.prototype,'currentTime');Object.defineProperty(off,'currentTime',{get:()=>i*1.6,configurable:true});fn(arg==null?undefined:isNaN(+arg)?arg:+arg);delete off.currentTime})}
  const buf=await off.startRendering();AC=keep.AC;master=keep.master;REV=keep.REV;BGM.gain=keep.g;BGM.song=keep.song;save.sound=keep.snd;_nb=null;
  const L=buf.getChannelData(0),R=buf.getChannelData(1);let pk=0,ss=0;for(let i=0;i<L.length;i++){pk=Math.max(pk,Math.abs(L[i]),Math.abs(R[i]));ss+=L[i]*L[i]}
  // 16-bit wav
  const n=L.length,ab=new ArrayBuffer(44+n*4),v=new DataView(ab);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*4,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,44100,true);v.setUint32(28,44100*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*4,true);
  for(let i=0;i<n;i++){v.setInt16(44+i*4,Math.max(-1,Math.min(1,L[i]))*32767,true);v.setInt16(46+i*4,Math.max(-1,Math.min(1,R[i]))*32767,true)}
  let bin='';const u=new Uint8Array(ab);for(let i=0;i<u.length;i+=32768)bin+=String.fromCharCode.apply(null,u.subarray(i,i+32768));
  return{peak:pk,rms:Math.sqrt(ss/n),wav:btoa(bin)}};
window.__cam=camera;window.__game={camRig:()=>({camBase,camTarget}),bgm:()=>({on:BGM.on,step:BGM.step,ac:AC&&AC.state}),get G(){return G},tapAnimal,startLevel,checkFree,genLevel,solvable,params,info:()=>({calls:renderer.info.render.calls,tris:renderer.info.render.triangles,geos:renderer.info.memory.geometries})};
})();
