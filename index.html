<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8fd46b">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}</style>
<title>몽글 목장 대탈출</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: full-screen 3D farm (WebGL) with a 2D effects layer on top, HUD pills along the top edge, count pill at the bottom. Single bright daytime look on purpose. */
:root{
  --grass:#8fd46b; --cream:#fff8ec; --ink:#5a3d32;
  --pink:#ff8fab; --pink-d:#e56a8c; --sun:#ffd34d; --sun-d:#f2a81d;
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--grass);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;height:100%;display:flex;flex-direction:column;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));}
#cv,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#cv{z-index:0;touch-action:none}
#fx{z-index:1;pointer-events:none}
.hud{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding-block:10px 4px;pointer-events:none}
.hud > *{pointer-events:auto}
.pill{background:var(--cream);border-radius:999px;padding:6px 14px;font-size:18px;
  box-shadow:0 3px 0 rgba(90,61,50,.22);display:flex;align-items:center;gap:6px;white-space:nowrap}
.hearts{display:flex;gap:2px}
.hearts svg{width:24px;height:24px;transition:transform .3s}
.hearts svg.lost{transform:scale(.8);opacity:.35;filter:grayscale(1)}
.sp{flex:1}
.ibtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--cream);color:var(--ink);
  box-shadow:0 3px 0 rgba(90,61,50,.22);display:grid;place-items:center;cursor:pointer;font-family:var(--font);padding:0}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(90,61,50,.22)}
.ibtn svg{width:24px;height:24px}
.ibtn:focus-visible,.btn:focus-visible{outline:3px solid var(--pink-d);outline-offset:2px}
.foot{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;justify-content:center;pointer-events:none}
.tip{position:absolute;left:16px;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:2;text-align:center;pointer-events:none}
.tip span{display:inline-block;background:rgba(255,248,236,.95);padding:8px 16px;border-radius:16px;font-size:17px;
  box-shadow:0 3px 0 rgba(90,61,50,.18);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.loading{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--grass);font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15)}

.ov{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(60,120,70,.35);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));backdrop-filter:blur(2px)}
#ovTitle{align-items:end;background:linear-gradient(to bottom,rgba(0,0,0,0) 30%,rgba(50,100,60,.35));backdrop-filter:none;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.card{background:var(--cream);border-radius:28px;padding:22px 20px 20px;width:min(340px,100%);text-align:center;
  box-shadow:0 8px 0 rgba(90,61,50,.2),0 20px 40px rgba(0,0,0,.15);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:0 0 6px;font-weight:400;font-size:30px;color:var(--pink-d);text-wrap:balance}
.card p{margin:0 0 14px;font-size:17px;opacity:.85}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 14px}
.stars svg{width:54px;height:54px}
.stars svg.on{animation:starIn .5s cubic-bezier(.3,1.8,.5,1) both}
.stars svg:nth-child(2){margin-top:-12px}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.btn{display:block;width:100%;border:none;border-radius:20px;padding:14px;font-family:var(--font);font-size:22px;cursor:pointer;
  background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-d);margin-top:10px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink-d)}
.btn.y{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d);text-shadow:none}
.btn.y:active{box-shadow:0 2px 0 var(--sun-d)}
.row{display:flex;gap:10px}.row .btn{font-size:18px;padding:11px}
.title{word-break:keep-all;font-weight:400;font-size:42px;line-height:1.02;color:#fff;text-shadow:0 4px 0 var(--pink-d),0 8px 0 rgba(90,61,50,.25);margin:0 0 4px}
.title small{display:block;font-size:19px;color:var(--ink);text-shadow:none;margin-top:8px}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:46vh;overflow:auto;padding:4px}
.lv{border:none;border-radius:14px;background:#fff;font-family:var(--font);font-size:18px;color:var(--ink);padding:8px 0 4px;
  box-shadow:0 3px 0 rgba(90,61,50,.18);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.lv small{font-size:10px;color:var(--sun-d);letter-spacing:1px;min-height:12px}
.lv.cur{background:var(--sun)}
.lv:disabled{opacity:.4;cursor:default}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>

<div id="app">
  <canvas id="cv" aria-label="게임 보드"></canvas>
  <canvas id="fx"></canvas>
  <div class="hud">
    <div class="pill" id="lvPill">레벨 1</div>
    <div class="pill hearts" id="hearts" aria-label="남은 하트"></div>
    <div class="sp"></div>
    <button class="ibtn" id="bHint" aria-label="힌트"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z" fill="#ffd34d" stroke="#5a3d32" stroke-width="1.6"/><path d="M9.5 20.5h5" stroke="#5a3d32" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="ibtn" id="bRe" aria-label="다시 하기"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3d32" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
    <button class="ibtn" id="bMenu" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3d32" stroke-width="2.4" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  </div>
  <div class="tip" id="tip" hidden><span id="tipTx"></span></div>
  <div class="foot"><div class="pill" id="left">남은 친구 0</div></div>
</div>
<div class="loading" id="loading">목장 준비 중…</div>

<div class="ov" id="ovTitle">
  <div class="card">
    <h1 class="title">몽글 목장 대탈출<small>얼굴이 향한 쪽이 뚫린 친구를 톡!</small></h1>
    <button class="btn" id="bPlay">시작하기</button>
    <div class="row">
      <button class="btn y" id="bLevels">레벨 고르기</button>
      <button class="btn y" id="bSound">소리 켜짐</button>
    </div>
  </div>
</div>
<div class="ov" id="ovLevels" hidden>
  <div class="card">
    <h2>레벨 고르기</h2>
    <div class="lvgrid" id="lvgrid"></div>
    <button class="btn y" id="bLvBack">돌아가기</button>
  </div>
</div>
<div class="ov" id="ovWin" hidden>
  <div class="card">
    <h2 id="winT">목장 탈출 성공!</h2>
    <div class="stars" id="winStars"></div>
    <p id="winP">친구들이 모두 풀밭으로 나갔어요</p>
    <button class="btn" id="bNext">다음 레벨</button>
    <button class="btn y" id="bAgain">다시 하기</button>
  </div>
</div>
<div class="ov" id="ovFail" hidden>
  <div class="card">
    <h2>앗, 하트가 없어요</h2>
    <p>친구들이 너무 많이 부딪혔어요.<br>순서를 잘 보고 다시 해 볼까요?</p>
    <button class="btn" id="bRetry">다시 도전</button>
    <button class="btn y" id="bFailMenu">메뉴로</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('loading').textContent='3D 엔진을 불러오지 못했어요. 새로고침해 주세요';return}
const DX=[0,1,0,-1], DZ=[-1,0,1,0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutBack=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const easeIn=t=>t*t;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- save ----------
const KEY='mongle-farm-v1';
let save={max:1,stars:{},sound:true};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save=Object.assign(save,s)}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};

// ---------- audio ----------
let AC=null,master=null;
function audio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination)}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); }
function tone(f0,f1,dur,type='sine',vol=.3,delay=0){ if(!AC||!save.sound)return; const t=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02)}
function noise(dur,freq,vol=.15,delay=0){ if(!AC||!save.sound)return; const t=AC.currentTime+delay;const n=AC.sampleRate*dur|0;const b=AC.createBuffer(1,n,AC.sampleRate);const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(freq*2.5,t+dur);f.Q.value=1.2;const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(t)}
const SFX={
  tap(){tone(900,1300,.07,'sine',.14)},
  go(p=0){const k=Math.pow(2,p/12);tone(520*k,1040*k,.13,'triangle',.26);tone(780*k,1560*k,.1,'sine',.12,.05);noise(.25,900,.08,.02)},
  boing(){tone(330,140,.28,'square',.07);tone(260,120,.32,'sine',.3)},
  voice(sp){const f={cow:260,chick:1250,bunny:900,cat:700,frog:330,bear:420}[sp]||600;tone(f,f*1.35,.09,'sine',.16);tone(f*1.3,f*.9,.12,'sine',.14,.08)},
  poof(){tone(1400,2200,.08,'sine',.08)},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,f*1.01,.25,'triangle',.22,i*.09));tone(1568,1580,.5,'sine',.12,.5)},
  fail(){[392,330,262].forEach((f,i)=>tone(f,f*.96,.3,'triangle',.2,i*.16))},
  ui(){tone(700,900,.06,'sine',.12)}
};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

// ---------- three setup ----------
if(THREE.ColorManagement)THREE.ColorManagement.legacyMode=false;
const cv=$('cv'),fx=$('fx'),fctx=fx.getContext('2d');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#9fdc78');
const camera=new THREE.PerspectiveCamera(36,1,.1,200);
scene.add(new THREE.HemisphereLight(0xdff2ff,0x6f9e4a,.6));
const sun=new THREE.DirectionalLight(0xfff0d6,1.35);sun.position.set(-6,14,8);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0006;sun.shadow.normalBias=.02;sun.shadow.radius=4;
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:40});
scene.add(sun);scene.add(sun.target);
const fill=new THREE.DirectionalLight(0xffe0f0,.25);fill.position.set(6,5,10);scene.add(fill);

// shared geometry + materials
const GS=new THREE.SphereGeometry(1,28,20), GS_LO=new THREE.SphereGeometry(1,14,10);
const GC=new THREE.ConeGeometry(1,1,20);
const matCache={};
function M(color,opt={}){const k=color+JSON.stringify(opt);if(!matCache[k])matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color,roughness:.62,metalness:0},opt));return matCache[k]}
const BLACK=M('#2a1d1a',{roughness:.18}), WHITE=M('#ffffff',{roughness:.3,emissive:'#ffffff',emissiveIntensity:.6}), BLUSH=M('#ff9fb6',{roughness:.9,transparent:true,opacity:.85});
function S(par,mat,r,x,y,z,sx=1,sy=1,sz=1,shadow=false,geo=GS){const m=new THREE.Mesh(geo,mat);m.scale.set(r*sx,r*sy,r*sz);m.position.set(x,y,z);if(shadow){m.castShadow=true}par.add(m);return m}

// soft contact shadow under each critter
const blobTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,2,32,32,32);gr.addColorStop(0,'rgba(40,60,20,.55)');gr.addColorStop(.6,'rgba(40,60,20,.25)');gr.addColorStop(1,'rgba(40,60,20,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const BLOB_M=new THREE.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false}), BLOB_G=new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2);
// arrow geometry (lies flat, points +z)
function arrowGeo(scale){const s=new THREE.Shape();const p=[[0,.26],[.24,.02],[.1,.02],[.1,-.2],[-.1,-.2],[-.1,.02],[-.24,.02]].map(([x,y])=>[x*scale,y*scale]);
  s.moveTo(...p[0]);for(let i=1;i<p.length;i++)s.lineTo(...p[i]);s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:.05,bevelEnabled:true,bevelThickness:.03,bevelSize:.025,bevelSegments:3,curveSegments:4});g.rotateX(Math.PI/2);return g}


// ---------- species (original mongle critters) ----------
const SPEC={
  bunny:{body:'#fff4f7',dark:'#f5d5e0',feet:'#f8dbe5',arrow:'#ff4f93'},
  chick:{body:'#ffe264',dark:'#ffc93a',feet:'#ff9f45',arrow:'#2f8fff'},
  cow:  {body:'#ffffff',dark:'#4a3b3b',feet:'#e8dede',arrow:'#ff8a1f'},
  cat:  {body:'#ffb866',dark:'#ef8f3a',feet:'#ffe3c4',arrow:'#9b55ff'},
  frog: {body:'#94e06c',dark:'#6cc24a',feet:'#7fd25a',arrow:'#ff3d5a'},
  bear: {body:'#c99368',dark:'#a8714a',feet:'#e8c7a5',arrow:'#00b8a9'},
};
const SP_KEYS=['bunny','chick','cow','cat','frog','bear'];

function buildCritter(sp){
  const C=SPEC[sp];const root=new THREE.Group();const bob=new THREE.Group();root.add(bob);
  const model=new THREE.Group();model.scale.setScalar(.95);bob.add(model);
  const mb=M(C.body),md=M(C.dark),mf=M(C.feet);
  // body: chubby mochi
  S(model,mb,.36,0,.36,-.04,1.02,.86,1.1,true);
  // feet
  for(const sx of[-1,1])for(const sz of[-1,1])S(model,mf,.085,sx*.18,.07,sz*.2-.03,1,.7,1.25,false,GS_LO);
  // head group
  const head=new THREE.Group();head.position.set(0,.6,.26);model.add(head);
  S(head,mb,.29,0,0,0,1.05,.96,1,true);
  // eyes
  const eyes=[];
  const eyeY=sp==='frog'?.16:.02, eyeZ=sp==='frog'?.18:.25, eyeX=sp==='frog'?.13:.115;
  if(sp==='frog'){for(const k of[-1,1]){S(head,mb,.11,k*.13,.15,.1,1,1,1,true);S(head,M('#ffffff',{roughness:.4}),.085,k*.13,.17,.15)}}
  for(const k of[-1,1]){const e=new THREE.Group();e.position.set(k*eyeX,eyeY,eyeZ);head.add(e);
    S(e,BLACK,.058,0,0,0,1,1.18,.62);S(e,WHITE,.021,.018,.028,.03);S(e,WHITE,.01,-.016,-.022,.032);eyes.push(e)}
  // blush
  for(const k of[-1,1])S(head,BLUSH,.055,k*.19,-.07,.2,1,.55,.35,false,GS_LO);
  // smile
  const smile=new THREE.Mesh(new THREE.TorusGeometry(.032,.009,6,12,Math.PI),BLACK);smile.rotation.z=Math.PI;smile.position.set(0,-.06,.285);
  // species dressing
  if(sp==='bunny'){
    for(const k of[-1,1]){const ear=new THREE.Group();ear.position.set(k*.11,.2,-.06);ear.rotation.set(-.45,0,k*.18);head.add(ear);
      S(ear,mb,.075,0,.2,0,1,2.9,.7,true);S(ear,M('#ffb3ca'),.045,0,.2,.035,1,2.4,.4)}
    S(model,M('#ffffff'),.11,0,.42,-.45,1,1,1,true);
    S(head,M('#ff8fb0'),.03,0,-.02,.29,1.2,.9,1);head.add(smile);
  }else if(sp==='chick'){
    const beak=new THREE.Mesh(GC,M('#ff9a3c'));beak.scale.set(.065,.11,.05);beak.rotation.x=Math.PI/2;beak.position.set(0,-.04,.3);head.add(beak);
    for(const [x,y,z,r] of[[0,.3,-.02,.05],[.05,.28,-.07,.04],[-.05,.28,-.06,.04]])S(head,md,r,x,y,z,1,1.3,1);
    for(const k of[-1,1]){const w=S(model,md,.13,k*.34,.38,-.05,.45,.9,1.25,true);w.rotation.z=k*.3}
    S(model,md,.09,0,.42,-.44,1,.7,1);
  }else if(sp==='cow'){
    S(head,M('#ffc3cf'),.14,0,-.08,.19,1.2,.78,.78,true);
    for(const k of[-1,1])S(head,M('#8a5a5a'),.025,k*.055,-.06,.3,1,1.2,.6);
    for(const k of[-1,1]){const h=new THREE.Mesh(GC,M('#ffe9a8'));h.scale.set(.045,.11,.045);h.position.set(k*.14,.26,-.02);h.rotation.z=-k*.4;h.castShadow=true;head.add(h)}
    for(const k of[-1,1]){const e=S(head,mb,.085,k*.3,.05,-.02,1.7,.6,1,true);e.rotation.z=k*.35;S(head,M('#ffc3cf'),.05,k*.31,.05,.02,1.5,.4,.4)}
    for(const [x,y,z,r] of[[.22,.52,-.15,.13],[-.24,.4,.12,.11],[.02,.66,-.28,.1],[-.12,.62,.05,.08],[.3,.3,.16,.08]])S(model,md,r,x,y,z,1,.6,1);
    S(head,md,.1,.12,.15,.12,1,.8,.6);
  }else if(sp==='cat'){
    for(const k of[-1,1]){const e=new THREE.Mesh(GC,mb);e.scale.set(.1,.17,.08);e.position.set(k*.16,.26,-.02);e.rotation.z=-k*.25;e.castShadow=true;head.add(e);
      const i=new THREE.Mesh(GC,M('#ffb0b8'));i.scale.set(.055,.11,.03);i.position.set(k*.16,.25,.03);i.rotation.z=-k*.25;head.add(i)}
    for(const [x,z] of[[0,-.05],[-.07,-.04],[.07,-.04]])S(head,md,.035,x,.26,z,1,.4,2.2);
    for(const [z] of[[-.2],[0],[.15]])S(model,md,.05,0,.66,z,4.6,.35,.8);
    const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,.3,-.4),new THREE.Vector3(0,.42,-.6),new THREE.Vector3(.08,.72,-.62),new THREE.Vector3(.14,.86,-.5)]);

// ---------- level generation ----------
function params(L){
  if(L===1)return{cols:3,rows:3,count:5,rocks:0};
  if(L===2)return{cols:4,rows:4,count:10,rocks:0};
  if(L===3)return{cols:4,rows:5,count:15,rocks:0};
  const cols=clamp(4+Math.floor((L-2)/4),4,8);
  const rows=clamp(cols+1+Math.floor((L-3)/9),5,11);
  const dens=Math.min(.74+L*.01,.95);
  const rocks=L>=6?Math.min(Math.floor((L-4)/3),Math.floor(cols*rows*.06)):0;
  return{cols,rows,count:Math.round(cols*rows*dens),rocks};
}
function clearPath(grid,p,r,c,d,self){let x=c+DX[d],y=r+DZ[d];while(x>=0&&y>=0&&x<p.cols&&y<p.rows){if(grid[y][x]&&grid[y][x]!==self)return false;x+=DX[d];y+=DZ[d]}return true}
function genLevel(L){
  const p=params(L);let best=null;
  for(let attempt=0;attempt<14;attempt++){
    const r=rng(L*7919+attempt*104729+13);
    const grid=Array.from({length:p.rows},()=>Array(p.cols).fill(null));const obs=[];
    for(let i=0;i<p.rocks;i++){const c=r()*p.cols|0,rr=r()*p.rows|0;if(!grid[rr][c]){const o={kind:'obs',r:rr,c,v:r()<.55?'rock':'hay',wig:0};grid[rr][c]=o;obs.push(o)}}
    const animals=[];let tries=0;
    const spPool=SP_KEYS.slice(0,clamp(2+Math.floor(L/2),2,6));
    while(animals.length<p.count&&tries<p.cols*p.rows*40){tries++;
      const c=r()*p.cols|0,rr=r()*p.rows|0;if(grid[rr][c])continue;
      const dirs=[0,1,2,3].filter(d=>clearPath(grid,p,rr,c,d));if(!dirs.length)continue;
      const a={kind:'animal',r:rr,c,dir:dirs[r()*dirs.length|0],sp:spPool[r()*spPool.length|0],seed:r()};grid[rr][c]=a;animals.push(a)}
    const free=animals.filter(a=>clearPath(grid,p,a.r,a.c,a.dir,a)).length;
    const score=animals.length*3-free*2;
    if(!best||score>best.score)best={score,grid,animals,obs,p};
  }
  return best;
}

let G=null,parts=[],floats=[],shake=0,time=0,combo=0,lastExit=-9,state='title',hintT=0,hintA=null,tipTimer=0,levelGroup=null;

function startLevel(L){

  G={L,cols:g.p.cols,rows:g.p.rows,grid:g.grid,obs:g.obs,hearts:3,mist:0,done:false,animals:g.animals};
  const env=buildEnv(G.cols,G.rows,L*31+7);G.track={x:G.cols/2+.65,z:G.rows/2+.65,door:env.doorZ};
  G.animals.forEach((a,i)=>{Object.assign(a,{id:i,off:0,state:'idle',v:0,bt:0,wig:0,sq:0,blinkT:1+a.seed*3,appear:-(a.r*.6+a.c*.4)*.045-.05,poof:0});
    a.m=buildCritter(a.sp);a.m.root.position.copy(cellPos(a.c,a.r));a.m.root.rotation.y=Math.atan2(DX[a.dir],DZ[a.dir]);a.m.root.userData.animal=a;levelGroup.add(a.m.root)});
  G.obs.forEach(o=>{o.m=buildObstacle(o.v);o.m.root.position.copy(cellPos(o.c,o.r));o.m.root.rotation.y=(o.r*3+o.c)%4*.5;o.m.root.userData.obs=o;levelGroup.add(o.m.root)});

// camera: tilted farm view, distance solved so the board fits between the HUD and the bottom pill
let camBase=new THREE.Vector3(),camTarget=new THREE.Vector3();
function fitCamera(){
  if(!G)return;
  const W=innerWidth,H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();
  const pitch=58*Math.PI/180;const dir=new THREE.Vector3(0,Math.sin(pitch),Math.cos(pitch));
  const hx=G.cols/2+.55,hz=G.rows/2+.55;
  const pts=[];for(const sx of[-1,1])for(const sz of[-1,1])for(const y of[0,.9])pts.push(new THREE.Vector3(sx*hx,y,sz*hz));pts.push(new THREE.Vector3(0,.8,-(G.rows/2+1.3+2.3)+1));
  const topLim=1-2*(Math.min(150,H*.16)/H), botLim=-1+2*(Math.min(120,H*.12)/H);
  let tz=0,D=4;
  const proj=()=>{let ok=true,ymin=9,ymax=-9;for(const p of pts){const v=p.clone().project(camera);if(Math.abs(v.x)>.95)ok=false;ymin=Math.min(ymin,v.y);ymax=Math.max(ymax,v.y)}return{ok,ymin,ymax}};
  const place=()=>{camera.position.copy(dir).multiplyScalar(D).add(new THREE.Vector3(0,0,tz));camera.lookAt(0,0,tz);camera.updateMatrixWorld()};
  for(let iter=0;iter<4;iter++){
    for(D=4;D<80;D+=.2){place();const q=proj();if(q.ok&&q.ymax-q.ymin<=topLim-botLim)break}
    const q=proj();const want=(topLim+botLim)/2,have=(q.ymin+q.ymax)/2;tz-=(have-want)*D*.3;
  }
  place();
  camBase.copy(camera.position);camTarget.set(0,0,tz);
  sun.position.set(-6,14,8+tz);sun.target.position.set(0,0,tz);
}
function resize(){const W=innerWidth,H=innerHeight;renderer.setSize(W,H,false);const d=Math.min(devicePixelRatio||1,2);fx.width=W*d;fx.height=H*d;fctx.setTransform(d,0,0,d,0,0);fitCamera()}

function checkFree(a){let x=a.c+DX[a.dir],y=a.r+DZ[a.dir],k=1;
  while(x>=0&&y>=0&&x<G.cols&&y<G.rows){const o=G.grid[y][x];if(o)return{free:false,dist:k,blk:o};x+=DX[a.dir];y+=DZ[a.dir];k++}return{free:true}}

const _v=new THREE.Vector3();
function toScreen(v){_v.copy(v).project(camera);return[(_v.x+1)/2*innerWidth,(1-_v.y)/2*innerHeight]}
function animalWorld(a,y=.5){const p=cellPos(a.c,a.r);p.x+=DX[a.dir]*a.off;p.z+=DZ[a.dir]*a.off;p.y=y;return p}

function nextInLine(a,sign){let x=a.c+DX[a.dir]*sign,y=a.r+DZ[a.dir]*sign;
  while(x>=0&&y>=0&&x<G.cols&&y<G.rows){const o=G.grid[y][x];if(o)return o;x+=DX[a.dir]*sign;y+=DZ[a.dir]*sign}return null}
const sameLine=(a,o)=>o&&o.kind==='animal'&&o.state==='idle'&&o.dir===a.dir;
function chainOf(a){let front=a;for(;;){const n=nextInLine(front,1);if(sameLine(a,n))front=n;else break}
  const mem=[front];let cur=front;for(;;){const n=nextInLine(cur,-1);if(sameLine(a,n)){mem.push(n);cur=n}else break}return{front,mem}}
const V3=(x,z)=>new THREE.Vector3(x,0,z);
function buildPath(a){
  const T=G.track,p=cellPos(a.c,a.r),d=a.dir;const pts=[V3(p.x,p.z)];
  if(d===0)pts.push(V3(p.x,-T.z));
  else if(d===1)pts.push(V3(T.x,p.z),V3(T.x,-T.z));
  else if(d===3)pts.push(V3(-T.x,p.z),V3(-T.x,-T.z));
  else{const sx=p.x<0?-1:p.x>0?1:(a.seed<.5?-1:1);pts.push(V3(p.x,T.z),V3(sx*T.x,T.z),V3(sx*T.x,-T.z))}
  pts.push(V3(0,-T.z),V3(0,T.door+.5),V3(0,T.door-.9));
  const out=[pts[0]];for(const q of pts.slice(1))if(q.distanceTo(out[out.length-1])>.01)out.push(q);
  const cum=[0];for(let i=1;i<out.length;i++)cum.push(cum[i-1]+out[i].distanceTo(out[i-1]));
  return{pts:out,cum,len:cum[cum.length-1]};
}
function pathAt(P,d){d=clamp(d,0,P.len);let i=1;while(i<P.cum.length-1&&P.cum[i]<d)i++;
  const a=P.pts[i-1],b=P.pts[i],t=(d-P.cum[i-1])/Math.max(1e-6,P.cum[i]-P.cum[i-1]);
  return{p:a.clone().lerp(b,t),ang:Math.atan2(b.x-a.x,b.z-a.z)}}
function startExit(a,delay){G.grid[a.r][a.c]=null;a.state='exit';a.v=2.5;a.sq=1;a.delay=delay;a.path=buildPath(a);a.pd=0;a.ang=a.m.root.rotation.y;
  if(hintA===a)hintA=null}
function tapAnimal(a){
  if(a.state!=='idle')return;audio();
  if(G.L===1&&tipTimer>50)tipTimer=2.5;
  const ch=chainOf(a);const f=checkFree(ch.front);const[sx,sy]=toScreen(animalWorld(a,.6));
  if(f.free){
    ch.mem.forEach((m,i)=>{startExit(m,i*.13);if(i>0)setTimeout(()=>SFX.go(Math.min(combo+i-1,12)),i*130)});
    combo=(time-lastExit<1.3)?combo+ch.mem.length:ch.mem.length;lastExit=time;
    if(ch.mem.length>1)floats.push({x:clamp(sx,90,innerWidth-90),y:sy-40,txt:'줄줄이 x'+ch.mem.length+'!',life:1.1,max:1.1});
    SFX.go(Math.min(combo-1,10));setTimeout(()=>SFX.voice(a.sp),40);buzz(8);
    for(let i=0;i<12;i++){const an=Math.random()*7;parts.push({x:sx,y:sy,vx:Math.cos(an)*140,vy:Math.sin(an)*140-50,life:.55,max:.55,s:3+Math.random()*4,c:['#fff','#ffe36b','#ffc2d1'][i%3],t:'dot'})}
    if(combo===3||combo===5||(combo>=10&&combo%5===0)){const words={3:'좋아요!',5:'멋져요!',10:'최고예요!',15:'대단해요!'};floats.length=0;floats.push({x:clamp(sx,90,innerWidth-90),y:sy-30,txt:(words[combo]||'완벽해요!')+' x'+combo,life:1.1,max:1.1})}
    renderHUD();
  }else{
    a.state='bump';a.bt=0;a.dist=f.dist-1+.3;a.blk=f.blk;a.hit=false;a.d1=Math.max(.08,a.dist/11);
  }
}
function onHit(a){
  a.hit=true;SFX.boing();buzz([20,30,20]);shake=.12;
  a.blk.wig=1;a.sq=1;
  const[hx,hy]=toScreen(animalWorld(a,.7).add(new THREE.Vector3(DX[a.dir]*.35,0,DZ[a.dir]*.35)));
  for(let i=0;i<9;i++){const an=i/9*Math.PI*2;parts.push({x:hx,y:hy,vx:Math.cos(an)*170,vy:Math.sin(an)*170,life:.4,max:.4,s:5,c:'#fff36b',t:'star'})}
  G.hearts--;G.mist++;renderHUD();
  const hs=$('hearts').children[G.hearts];if(hs)hs.animate([{transform:'scale(1.6)'},{transform:'scale(.8)'}],{duration:350,easing:'ease-out'});
  floats.push({x:hx,y:hy-20,txt:'콩!',life:.75,max:.75,red:true});
  if(G.hearts<=0){G.done=true;setTimeout(()=>{SFX.fail();show('ovFail')},900)}
}

// picking
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
cv.addEventListener('pointerdown',e=>{
  if(state!=='play'||!G||G.done)return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const roots=[...G.animals.filter(a=>a.state==='idle').map(a=>a.m.root),...G.obs.map(o=>o.m.root)];
  const hits=ray.intersectObjects(roots,true);
  for(const h of hits){if(h.object.geometry&&h.object.geometry.type==='RingGeometry')continue;let o=h.object;while(o&&!o.userData.animal&&!o.userData.obs)o=o.parent;if(o){if(o.userData.animal){tapAnimal(o.userData.animal);return}if(o.userData.obs){o.userData.obs.wig=.6;SFX.tap();return}}}
  const p=new THREE.Vector3();if(ray.ray.intersectPlane(plane,p)){const c=Math.round(p.x+(G.cols-1)/2),r=Math.round(p.z+(G.rows-1)/2);
    if(c>=0&&r>=0&&c<G.cols&&r<G.rows){const o=G.grid[r][c];if(o&&o.kind==='animal')tapAnimal(o)}}
});

// ---------- update ----------
function update(dt){
  time+=dt;shake=Math.max(0,shake-dt*.6);
  if(tipTimer>0&&tipTimer<50){tipTimer-=dt;if(tipTimer<=0)$('tip').hidden=true}
  if(!G)return;
  let alive=0;
  for(const a of G.animals){
    if(a.state==='gone')continue;
    const m=a.m;a.appear=Math.min(1,a.appear+dt*2.6);
    a.wig=Math.max(0,a.wig-dt*2.2);a.sq=Math.max(0,a.sq-dt*3.5);
    a.blinkT-=dt;if(a.blinkT<-.13)a.blinkT=2+Math.random()*3.5;
    const blink=a.blinkT<0?.12:1;for(const e of m.eyes)e.scale.y=blink;
    const br=Math.sin(time*3.2+a.seed*9);
    let hop=0,sx=1,sy=1+br*.025,sz=1;
    m.head.rotation.y=a.state==='idle'?Math.sin(time*.9+a.seed*20)*.18:0;
    m.head.rotation.z=Math.sin(time*1.3+a.seed*7)*.06;
    if(a.state==='exit'){
      if(a.delay>0){a.delay-=dt;hop=Math.abs(Math.sin(time*18))*.06}
      else{a.v=Math.min(a.v+dt*16,7);a.pd+=a.v*dt;hop=Math.abs(Math.sin(a.pd*Math.PI*1.25))*.2;sy=1+Math.sin(a.pd*Math.PI*2.5)*.08;sx=sz=1/Math.sqrt(sy)}
      const P=a.path,q=pathAt(P,a.pd);
      let da=q.ang-a.ang;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;a.ang+=da*(1-Math.exp(-dt*12));
      m.root.rotation.y=a.ang;m.head.rotation.x=-.12;
      a.wpos=q.p;
      if(a.delay<=0&&Math.random()<dt*20){const[px,py]=toScreen(q.p.clone().add(new THREE.Vector3(-Math.sin(a.ang)*.35,.05,-Math.cos(a.ang)*.35)));parts.push({x:px+(Math.random()-.5)*10,y:py,vx:(Math.random()-.5)*30,vy:-15-Math.random()*15,life:.4,max:.4,s:3+Math.random()*3,c:'rgba(255,250,240,.85)',t:'puff'})}
      a.poof=clamp((a.pd-(P.len-1.1))/.9,0,1);
      if(a.poof>=1){a.state='gone';levelGroup.remove(m.root);
        const[ex,ey]=toScreen(new THREE.Vector3(0,1.3,G.track.door));SFX.poof();for(let i=0;i<4;i++)parts.push({x:ex+(Math.random()-.5)*30,y:ey,vx:(Math.random()-.5)*80,vy:-60-Math.random()*90,life:.8,max:.8,s:6,c:'#ff8fab',t:'heart'});continue}
      alive++;
    }else{
      alive++;
      if(a.state==='bump'){a.bt+=dt;
        if(a.bt<a.d1){a.off=easeIn(a.bt/a.d1)*a.dist}
        else{if(!a.hit)onHit(a);const q=Math.min(1,(a.bt-a.d1)/.45);a.off=a.dist*(1-easeOutBack(q));if(q>=1){a.off=0;a.state='idle'}}
        m.head.rotation.x=a.hit?.25*Math.sin(a.bt*30)*(1-Math.min(1,(a.bt-a.d1)/.45)):0;
      }else m.head.rotation.x=0;
    }
    if(a.sq>0){const k=a.sq*.25;sz*=1-k;sx*=1+k*.6;sy*=1+k*.4}
    const ap=Math.max(0,a.appear);const drop=(1-clamp(ap*1.6,0,1))*3;
    if(a.state==='exit')m.root.position.set(a.wpos.x,hop,a.wpos.z);
    else{const pos=cellPos(a.c,a.r);m.root.position.set(pos.x+DX[a.dir]*a.off,drop+hop,pos.z+DZ[a.dir]*a.off)}
    const s=ap<=0?0.0001:(ap<1?easeOutBack(ap)*.4+.6:1)*(1-a.poof)+0.0001;
    m.bob.scale.set(sx*s,sy*s,sz*s);
    m.bob.rotation.z=Math.sin(time*40)*a.wig*.18;
    m.ring.material.opacity=hintA===a?.55+.35*Math.sin(time*10):0;
    m.bob.position.y=hintA===a?Math.abs(Math.sin(time*7))*.15:0;
    m.blob.position.y=.02-m.root.position.y;m.blob.material.opacity=1;
  }
  for(const o of G.obs){o.wig=Math.max(0,o.wig-dt*2.5);o.m.inner.rotation.z=Math.sin(time*40)*o.wig*.1}
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.05,dt);p.vy=p.vy*Math.pow(.05,dt)+(p.t==='heart'?60:p.t==='conf'?240:0)*dt}
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.life-=dt;f.y-=40*dt}floats=floats.filter(f=>f.life>0);
  if(hintT>0){hintT-=dt;if(hintT<=0)hintA=null}
  if(!G.done&&!G.animals.some(a=>a.state==='idle'||a.state==='bump')){G.done=true;setTimeout(win,1500)}
  camera.position.copy(camBase);camera.position.x+=Math.sin(time*.4)*.08;
  if(shake>0){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake}
  camera.lookAt(camTarget);
}

// ---------- 2D fx layer ----------
function star2(c,x,y,s){c.beginPath();for(let i=0;i<10;i++){const r=i%2?s*.45:s,a=i/10*Math.PI*2-Math.PI/2;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.closePath();c.fill()}
function heart2(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.9);c.bezierCurveTo(x-s*1.4,y,x-s*.7,y-s,x,y-s*.3);c.bezierCurveTo(x+s*.7,y-s,x+s*1.4,y,x,y+s*.9);c.fill()}
function drawFx(){
  const c=fctx;c.clearRect(0,0,innerWidth,innerHeight);
  for(const p of parts){const k=p.life/p.max;c.globalAlpha=Math.min(1,k*1.6);c.fillStyle=p.c;
    if(p.t==='puff'){c.beginPath();c.arc(p.x,p.y,p.s*(1.5-k*.6),0,7);c.fill()}
    else if(p.t==='heart')heart2(c,p.x,p.y,p.s);
    else if(p.t==='star')star2(c,p.x,p.y,p.s*1.6*k+1);
    else if(p.t==='conf'){c.save();c.translate(p.x,p.y);c.rotate(p.life*8+p.s);c.fillRect(-5,-3,10,6);c.restore()}
    else{c.beginPath();c.arc(p.x,p.y,p.s*k,0,7);c.fill()}}
  c.globalAlpha=1;c.textAlign='center';c.lineJoin='round';
  for(const f of floats){const k=f.life/f.max;c.globalAlpha=Math.min(1,k*2);c.font='28px Jua, system-ui';c.lineWidth=6;c.strokeStyle=f.red?'#c94a6c':'#5a3d32';c.strokeText(f.txt,f.x,f.y);c.fillStyle='#fff';c.fillText(f.txt,f.x,f.y)}
  c.globalAlpha=1;
}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera);drawFx();requestAnimationFrame(loop)}

// ---------- flow ----------
function show(id){['ovTitle','ovLevels','ovWin','ovFail'].forEach(k=>$(k).hidden=k!==id);state=id?'menu':'play'}
function win(){
  const st=Math.max(1,3-G.mist),L=G.L;
  save.stars[L]=Math.max(save.stars[L]||0,st);save.max=Math.max(save.max,L+1);persist();
  SFX.win();buzz([30,40,60]);
  for(let i=0;i<100;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.3,y:innerHeight*.35,vx:(Math.random()-.5)*750,vy:-Math.random()*650-100,life:1.8+Math.random(),max:2.8,s:Math.random()*6,c:['#ff8fab','#ffd34d','#7fdcc0','#9ac8ff','#fff'][i%5],t:'conf'});
  const msgs=['완벽해요! 한 번도 안 부딪혔어요','잘했어요! 거의 완벽해요','성공! 다음엔 별 3개 도전'];
  $('winT').textContent=`레벨 ${L} 탈출 성공!`;$('winP').textContent=msgs[3-st];
  const starSvg=on=>`<svg viewBox="0 0 24 24" class="${on?'on':''}"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.6 6.6-.8z" fill="${on?'#ffd34d':'#e9dcc6'}" stroke="${on?'#e0951a':'#cbb99c'}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
  $('winStars').innerHTML=[0,1,2].map(i=>starSvg(i<st)).join('');
  [...$('winStars').children].forEach((s,i)=>s.style.animationDelay=(.25+i*.18)+'s');
  setTimeout(()=>show('ovWin'),350);
}
function buildLevels(){
  const n=Math.max(30,Math.ceil((save.max+5)/5)*5);let h='';
  for(let i=1;i<=n;i++){const s=save.stars[i]||0;h+=`<button class="lv${i===save.max?' cur':''}" data-l="${i}" ${i>save.max?'disabled':''}>${i}<small>${'★'.repeat(s)}</small></button>`}
  $('lvgrid').innerHTML=h;
}
$('lvgrid').addEventListener('click',e=>{const b=e.target.closest('.lv');if(!b||b.disabled)return;audio();SFX.ui();show(null);startLevel(+b.dataset.l)});
$('bPlay').onclick=()=>{audio();SFX.ui();show(null);startLevel(save.max)};
$('bLevels').onclick=()=>{audio();SFX.ui();buildLevels();show('ovLevels')};
$('bLvBack').onclick=()=>{SFX.ui();show('ovTitle')};
const sndLabel=()=>$('bSound').textContent=save.sound?'소리 켜짐':'소리 꺼짐';sndLabel();
$('bSound').onclick=()=>{save.sound=!save.sound;persist();sndLabel();audio();SFX.ui()};
$('bNext').onclick=()=>{SFX.ui();show(null);startLevel(G.L+1)};
$('bAgain').onclick=()=>{SFX.ui();show(null);startLevel(G.L)};
$('bRetry').onclick=()=>{SFX.ui();show(null);startLevel(G.L)};
$('bFailMenu').onclick=()=>{SFX.ui();show('ovTitle')};
$('bRe').onclick=()=>{if(state!=='play')return;audio();SFX.ui();startLevel(G.L)};
$('bMenu').onclick=()=>{audio();SFX.ui();show('ovTitle')};
$('bHint').onclick=()=>{if(state!=='play'||!G||G.done)return;audio();SFX.ui();
  const free=G.animals.filter(a=>a.state==='idle'&&checkFree(a).free);if(free.length){hintA=free[Math.random()*free.length|0];hintT=2.4;hintA.wig=.5}};

addEventListener('resize',resize);
resize();
startLevel(Math.max(4,Math.min(save.max,8)));state='menu';$('tip').hidden=true;
$('loading').hidden=true;
requestAnimationFrame(loop);
window.__game={get G(){return G},tapAnimal,startLevel,checkFree};
})();
</script>
